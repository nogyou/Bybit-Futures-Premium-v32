
name: Build Bybit Futures v3.3.0 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Apply v3.3.0 source
        run: |
          unzip -o Bybit-Futures-Premium-v3.3.0-Arena-Journal-Source.zip
          grep -n 'versionName' app/build.gradle.kts | grep '3\.3\.0'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Bybit-v330-Arena-Journal-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
